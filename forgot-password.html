<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Attendance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-nav"></div>

<div class="page-container" style="max-width: 420px;">
    <div class="card mt-5">
        <div class="card-body p-4">
            <h4 class="card-title mb-3">Forgot your password?</h4>
            <p class="text-muted small">Enter your email and we'll send a 6-digit code you can use to reset it.</p>
            <div id="alert-box"></div>
            <form id="forgot-form">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="forgot-btn">Send code</button>
            </form>
            <p class="text-center mt-3 mb-0"><a href="index.html">Back to login</a></p>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script>
$(function () {
    Nav.render();

    $('#forgot-form').on('submit', function (e) {
        e.preventDefault();
        clearAlert('#alert-box');
        const email = $('#email').val();
        $('#forgot-btn').prop('disabled', true).text('Sending...');

        Api.post('/auth/forgot-password', { email }).done((res) => {
            window.location.href = 'reset-password.html?email=' + encodeURIComponent(email);
        }).fail((err) => {
            showAlert('#alert-box', err);
            $('#forgot-btn').prop('disabled', false).text('Send code');
        });
    });
});
</script>
</body>
</html>
