<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in — Attendance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-nav"></div>

<div class="page-container" style="max-width: 420px;">
    <div class="card mt-5">
        <div class="card-body p-4">
            <h4 class="card-title mb-3">Employee Login</h4>
            <div id="alert-box"></div>
            <form id="login-form">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" id="login-btn">Log in</button>
            </form>
            <div class="d-flex justify-content-between mt-3">
                <a href="register.html">Create an account</a>
                <a href="forgot-password.html">Forgot password?</a>
            </div>
        </div>
    </div>

    <div class="card mt-3">
        <div class="card-body p-3 text-center small text-muted">
            No account needed —
            <a href="guest-leave.html">submit a leave request</a> or
            <a href="borrow.html">book equipment</a> as a guest.
        </div>
    </div>

    <p class="text-center text-muted mt-3 small">
        Demo logins: <code>admin@example.com</code> / <code>demo@example.com</code> — password <code>password</code>
    </p>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script src="/assets/js/pwa-install.js"></script>
<script>
$(function () {
    if (Api.isLoggedIn()) {
        window.location.href = Api.isAdmin() ? 'admin/dashboard.html' : 'dashboard.html';
        return;
    }
    Nav.render();

    $('#login-form').on('submit', function (e) {
        e.preventDefault();
        clearAlert('#alert-box');
        $('#login-btn').prop('disabled', true).text('Logging in...');

        Api.post('/auth/login', {
            email: $('#email').val(),
            password: $('#password').val(),
        }).done((res) => {
            Api.setToken(res.token);
            Api.setCurrentUser(res.user);
            window.location.href = res.user.role === 'admin' ? 'admin/dashboard.html' : 'dashboard.html';
        }).fail((err) => {
            showAlert('#alert-box', err);
            $('#login-btn').prop('disabled', false).text('Log in');
        });
    });
});
</script>
</body>
</html>
