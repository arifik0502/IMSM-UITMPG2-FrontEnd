<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Requests — Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="app-nav"></div>

<div class="page-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Leave Requests</h3>
        <div class="btn-group" id="status-filter">
            <button class="btn btn-outline-primary active" data-status="pending">Pending</button>
            <button class="btn btn-outline-primary" data-status="approved">Approved</button>
            <button class="btn btn-outline-primary" data-status="rejected">Rejected</button>
            <button class="btn btn-outline-primary" data-status="all">All</button>
        </div>
    </div>
    <div id="alert-box"></div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table mb-0 align-middle">
                <thead><tr><th>Requester</th><th>Type</th><th>Dates</th><th>Reason</th><th>Status</th><th></th></tr></thead>
                <tbody id="leave-body"><tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
    <nav class="mt-3"><ul class="pagination" id="pagination"></ul></nav>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="/assets/js/pwa-install.js"></script>
<script src="../assets/js/admin-leave.js"></script>
</body>
</html>
