<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Detail — Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div id="app-nav"></div>

<div class="page-container">
    <a href="employees.html" class="small d-inline-block mb-2">← Back to employees</a>
    <h3 class="mb-3" id="employee-name">Loading...</h3>
    <div id="alert-box"></div>

    <div class="row g-3 mb-4" id="stat-cards"></div>

    <div class="d-flex flex-wrap gap-2 mb-3">
        <div class="btn-group" id="period-filter">
            <button class="btn btn-outline-primary" data-period="daily">Daily</button>
            <button class="btn btn-outline-primary" data-period="weekly">Weekly</button>
            <button class="btn btn-outline-primary active" data-period="monthly">Monthly</button>
        </div>
        <div class="btn-group" id="location-filter">
            <button class="btn btn-outline-secondary active" data-location="all">All</button>
            <button class="btn btn-outline-secondary" data-location="office">Office</button>
            <button class="btn btn-outline-secondary" data-location="home">Home</button>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table mb-0">
                <thead><tr><th>Date</th><th>Location</th><th>Clock In</th><th>Clock Out</th><th>Late</th><th>Overtime</th></tr></thead>
                <tbody id="attendance-body"><tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr></tbody>
            </table>
        </div>
    </div>
    <nav class="mt-3"><ul class="pagination" id="pagination"></ul></nav>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/admin-employee.js"></script>
</body>
</html>
