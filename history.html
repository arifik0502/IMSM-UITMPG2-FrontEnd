<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance History — Attendance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-nav"></div>

<div class="page-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Attendance History</h3>
        <div class="btn-group" id="period-filter">
            <button class="btn btn-outline-primary" data-period="daily">Daily</button>
            <button class="btn btn-outline-primary" data-period="weekly">Weekly</button>
            <button class="btn btn-outline-primary active" data-period="monthly">Monthly</button>
        </div>
    </div>
    <div id="alert-box"></div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table mb-0 align-middle">
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Location</th>
                    <th>Clock In</th>
                    <th>Clock Out</th>
                    <th>Late (min)</th>
                    <th>Overtime (min)</th>
                    <th>Breaks</th>
                </tr>
                </thead>
                <tbody id="history-body">
                <tr><td colspan="7" class="text-center text-muted py-4">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3">
        <ul class="pagination" id="pagination"></ul>
    </nav>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script src="/assets/js/pwa-install.js"></script>
<script src="assets/js/history.js"></script>
</body>
</html>
