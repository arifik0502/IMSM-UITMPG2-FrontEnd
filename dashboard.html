<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Attendance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-nav"></div>

<div class="page-container">
    <h3 class="mb-3">Dashboard</h3>
    <div id="alert-box"></div>

    <div class="card mb-3">
        <div class="card-body">
            <h5 class="card-title">Today's status</h5>
            <div id="status-panel">Loading...</div>

            <div class="mt-3 d-flex flex-wrap gap-2">
                <div class="btn-group" role="group">
                    <button class="btn btn-outline-primary" id="location-office-btn">Office</button>
                    <button class="btn btn-outline-primary" id="location-home-btn">Home</button>
                </div>
                <button class="btn btn-success" id="clock-in-btn" disabled>Clock In</button>
                <button class="btn btn-danger" id="clock-out-btn" disabled>Clock Out</button>
                <button class="btn btn-warning" id="break-start-btn" disabled>Start Break</button>
                <button class="btn btn-secondary" id="break-end-btn" disabled>End Break</button>
            </div>
        </div>
    </div>
</div>

<!-- Camera modal -->
<div class="modal" id="camera-modal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="camera-modal-title">Take a selfie</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center">
                <div id="camera-error" class="alert alert-danger d-none"></div>
                <video id="camera-video" autoplay playsinline></video>
                <img id="camera-preview" class="d-none">
                <canvas id="camera-canvas" class="d-none"></canvas>
            </div>
            <div class="modal-footer justify-content-center">
                <button class="btn btn-primary" id="camera-capture-btn">Capture</button>
                <button class="btn btn-outline-secondary d-none" id="camera-retake-btn">Retake</button>
                <button class="btn btn-success d-none" id="camera-submit-btn">Submit</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script src="/assets/js/pwa-install.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
