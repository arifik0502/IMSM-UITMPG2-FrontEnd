<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Attendance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-nav"></div>

<div class="page-container" style="max-width: 560px;">
    <h3 class="mb-3">Profile</h3>
    <div id="alert-box"></div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Update details</h5>
            <form id="profile-form" class="row g-3">
                <div class="col-12">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary" id="profile-btn">Save changes</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Change password</h5>
            <form id="password-form" class="row g-3">
                <div class="col-12">
                    <label class="form-label">Current password</label>
                    <input type="password" class="form-control" id="current_password" required>
                </div>
                <div class="col-12">
                    <label class="form-label">New password</label>
                    <input type="password" class="form-control" id="password" required minlength="8">
                </div>
                <div class="col-12">
                    <label class="form-label">Confirm new password</label>
                    <input type="password" class="form-control" id="password_confirmation" required minlength="8">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary" id="password-btn">Update password</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-danger">
        <div class="card-body">
            <h5 class="card-title text-danger">Delete account</h5>
            <p class="text-muted small">This permanently deletes your account and cannot be undone.</p>
            <form id="delete-form" class="row g-3">
                <div class="col-12">
                    <label class="form-label">Confirm your password</label>
                    <input type="password" class="form-control" id="delete_password" required>
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-outline-danger" id="delete-btn">Delete my account</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script src="/assets/js/pwa-install.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>
