<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Attendance System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="app-nav"></div>

<div class="page-container" style="max-width: 420px;">
    <div class="card mt-5">
        <div class="card-body p-4">
            <h4 class="card-title mb-3">Reset your password</h4>
            <p class="text-muted small">Enter the 6-digit code we emailed you (check the API's log output if <code>MAIL_MAILER=log</code>) along with your new password.</p>
            <div id="alert-box"></div>
            <form id="reset-form">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">6-digit code</label>
                    <input type="text" class="form-control" id="code" pattern="\d{6}" maxlength="6" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">New password</label>
                    <input type="password" class="form-control" id="password" required minlength="8">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm new password</label>
                    <input type="password" class="form-control" id="password_confirmation" required minlength="8">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="reset-btn">Reset password</button>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/nav.js"></script>
<script>
$(function () {
    Nav.render();

    const params = new URLSearchParams(window.location.search);
    if (params.get('email')) {
        $('#email').val(params.get('email'));
    }

    $('#reset-form').on('submit', function (e) {
        e.preventDefault();
        clearAlert('#alert-box');
        $('#reset-btn').prop('disabled', true).text('Resetting...');

        Api.post('/auth/reset-password', {
            email: $('#email').val(),
            code: $('#code').val(),
            password: $('#password').val(),
            password_confirmation: $('#password_confirmation').val(),
        }).done(() => {
            showAlert('#alert-box', 'Password reset. You can now log in.', 'success');
            setTimeout(() => window.location.href = 'index.html', 1500);
        }).fail((err) => {
            showAlert('#alert-box', err);
            $('#reset-btn').prop('disabled', false).text('Reset password');
        });
    });
});
</script>
</body>
</html>
